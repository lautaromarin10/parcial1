<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home | FoodStore</title>
    <link rel="stylesheet" href="../../../styles/global.css" />
  </head>
  <body>
    <header
      class="h-20 w-screen bg-card z-50 top-0 border-b border-muted-foreground flex flex-row items-center sticky"
    >
      <div class="container mx-auto flex items-center justify-between">
        <a href="/src/pages/store/home/home.html" class="text-xl">FoodStore</a>
        <div id="headerActions"></div>
      </div>
    </header>
    <main class="container mx-auto py-16">
      <aside
        class="hidden aria-expanded:flex flex-col aria-expanded:fixed duration-300 top-0 p-4 left-0 w-75 mt-20 z-20 bg-card h-full"
        id="asideContent"
        aria-expanded="false"
      >
        <button
          class="button primary w-fit gap-2 flex items-center"
          id="closeAsideButton"
        >
          <img src="/icons/chevronLeft.svg" class="icon invert" />
          Cerrar
        </button>
        <div class="flex flex-col mt-4">
          <div class="flex flex-col">
            <h2 class="text-xl">Categorías</h2>
            <p>Filtrar por categorías</p>
          </div>
          <div class="flex flex-col mt-2">
            <ul class="flex flex-col gap-2" id="categoriesContainer">
              <li
                class="button ring-2 ring-muted-foreground aria-selected:bg-primary aria-selected:text-white"
                aria-selected="true"
              >
                Ver todo
              </li>
            </ul>
          </div>
        </div>
      </aside>
      <section class="container mx-auto">
        <div class="main__content__inner">
          <div class="flex flex-col sm:flex-row mb-4 gap-4">
            <button class="button secondary" id="openAsideButton">
              Categorías
            </button>
            <input
              class="px-4 py-3 border border-gray-100 rounded-md"
              id="filterInput"
              placeholder="Buscar productos..."
            />
            <select
              id="sortSelect"
              class="px-4 py-3 border border-gray-100 rounded-md bg-white"
            >
              <option value="default">Ordenar por</option>
              <option value="name-asc">Nombre A-Z</option>
              <option value="name-desc">Nombre Z-A</option>
              <option value="price-asc">Precio ascendente</option>
              <option value="price-desc">Precio descendente</option>
            </select>
          </div>
          <div
            id="productContainer"
            class="grid gap-4 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3"
          ></div>
        </div>
      </section>
    </main>
    <div class="modal__wrapper" id="modalWrapper">
      <div class="modal rounded" id="modalMessageContainer"></div>
    </div>
    <script src="./home.ts" type="module"></script>
  </body>
</html>
