<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../../../styles/global.css" />
  </head>
  <body>
    <header
      class="h-20 w-screen bg-card z-50 top-0 border-b border-muted-foreground flex flex-row items-center sticky"
    >
      <div class="container mx-auto flex items-center justify-between">
        <a href="/src/pages/store/home/home.html" class="text-xl">FoodStore</a>
        <div id="headerActions"></div>
      </div>
    </header>
    <main class="flex flex-col lg:flex-row h-[calc(100vh-80px)]">
      <aside class="w-full lg:w-1/6 p-4 lg:h-full!">
        <div
          class="flex ring-2 w-full ring-muted-foreground p-4 h-full rounded-md flex-col"
        >
          <div class="flex flex-col w-full">
            <h2 class="text-xl">Administración</h2>
            <p>Panel de control</p>
            <ul class="flex flex-col my-4 w-full [&>li]:h-fit [&>li]:my-1.5 [&>li>a]:text-center">
              <li class="w-full">
                <a href="/src/pages/admin/adminHome/adminHome.html" class="button ring-primary ring w-full block text-left">Dashboard</a>
              </li>
              <li class="w-full">
                <a href="/src/pages/admin/categories/categories.html" class="button ring-muted-foreground ring w-full block text-left">Categorías</a>
              </li>
              <li class="w-full">
                <a href="/src/pages/admin/products/products.html" class="button ring-muted-foreground ring w-full block text-left">Productos</a>
              </li>
              <li class="w-full">
                <a href="/src/pages/admin/orders/orders.html" class="button ring-muted-foreground ring w-full block text-left">Pedidos</a>
              </li>
            </ul>
            <a class="button primary w-fit" href="/src/pages/store/home/home.html">Ir a la tienda</a>
          </div>
        </div>
      </aside>
      <section class="w-full lg:w-5/6 p-4">
        <div class="flex flex-col w-full">
          <h1 class="text-2xl mb-4">Panel de Administración</h1>
          <div class="grid grid-cols-2 gap-4 sm:grid-cols-4" id="statisticsContainer">
        </div>
      </section>
    </main>
    <script type="module" src="adminHome.ts"></script>
  </body>
</html>
