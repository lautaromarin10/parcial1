<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../../../styles/global.css" />
    <title>Iniciar sesión | FoodStore</title>
  </head>
  <body>
    <main class="h-screen container mx-auto flex items-center">
      <div
        class="min-w-120 max-w-200 ring bg-card shadow-md flex flex-col ring-muted-foreground rounded-md p-8 mx-auto h-fit"
      >
        <h1 class="text-3xl">Iniciar sesión</h1>
        <form id="loginForm" class="my-4 flex flex-col">
          <div class="flex flex-col mb-2">
            <label for="correo" class="mb-1">Correo electrónico</label>
            <input
              id="correo"
              name="email"
              class="p-3 ring rounded-md ring-muted-foreground mb-2 bg-white"
              type="text"
              placeholder="Correo electrónico"
            />
          </div>
          <div class="flex flex-col mb-2">
            <label for="pass" class="mb-1">Contraseña</label>
            <input
              id="pass"
              class="p-3 ring rounded-md ring-muted-foreground mb-2 bg-white"
              type="password"
              name="password"
              placeholder="Contraseña"
            />
          </div>
          <button type="submit" class="button primary w-fit">
            Iniciar sesión
          </button>
        </form>
        <div id="errorContainer"></div>
      </div>
    </main>
    <script type="module" src="login.ts"></script>
  </body>
</html>
